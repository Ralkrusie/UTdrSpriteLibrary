name: Attach macOS and Linux release assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native build run ID
        required: true
        type: string
      tag:
        description: Existing draft prerelease tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-posix-prerelease
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Ralkrusie/UTdrSpriteLibrary'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NATIVE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python tools/release/publish_posix.py
