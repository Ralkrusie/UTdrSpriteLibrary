<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DELTARUNE 本地贴图库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#e8ecf3;font:15px/1.6 system-ui,sans-serif}header{position:sticky;top:0;background:#171b24;z-index:2;padding:14px 24px;border-bottom:1px solid #414b60}h1{font-size:22px;margin:0 0 8px}input,select,button,a.download{background:#252d3b;color:inherit;border:1px solid #52617a;padding:7px 10px;font:inherit}input[type=search]{width:min(420px,90vw)}button,a{cursor:pointer}a{color:#a9c9ff}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{padding:20px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:#191e28;border:1px solid #394254;padding:12px;cursor:pointer;min-width:0}.card:hover{border-color:#9abdff}.name{overflow-wrap:anywhere;font-family:monospace}.preview,.stage{background-color:#343841;background-image:linear-gradient(45deg,#282b32 25%,transparent 25%),linear-gradient(-45deg,#282b32 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#282b32 75%),linear-gradient(-45deg,transparent 75%,#282b32 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview{height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.preview img{max-width:100%;max-height:150px;object-fit:contain;image-rendering:pixelated}small,.muted{color:#b2bed0}nav{display:flex;gap:16px;justify-content:center;margin:18px}dialog{width:min(1100px,95vw);max-height:94vh;overflow:auto;background:#171b24;color:inherit;border:1px solid #62738f;padding:20px}dialog::backdrop{background:#000b}.top{display:flex;justify-content:space-between;gap:12px}.stage{overflow:auto;max-height:52vh;min-height:180px;display:grid;place-items:center;margin:12px 0;padding:12px}.stage img{image-rendering:pixelated;max-width:none}.details{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.frames{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.frames button{padding:3px 9px}.frames button[aria-pressed=true]{background:#426299}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#stats{margin-top:6px}
</style>
<header><h1>DELTARUNE 本地贴图库 · 第 1–5 章并集</h1><div class="filters"><input id="search" type="search" placeholder="搜索资源名，例如 soul、face、castle" aria-label="搜索资源名"><select id="kind" aria-label="资源类型"><option value="">全部类型</option><option value="sprite">精灵 / 动画</option><option value="background">背景 / 图块集</option><option value="font">字体贴图</option></select><select id="chapter" aria-label="章节"><option value="">全部章节</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label><input id="variants" type="checkbox">只看同名变体</label></div><div id="stats" class="muted"></div></header>
<main><p class="muted">同名相同内容合并，同名差异保留。点开查看全部帧、原点和章节资源编号。PNG 保留透明画布；此处动画为可调速预览，不代表游戏实际播放。</p><nav><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><div id="grid" class="grid"></div></main>
<dialog id="detail"><div class="top"><h2 id="title"></h2><button id="close">关闭</button></div><div class="bar"><label>变体 <select id="variant"></select></label><label>缩放 <select id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="0.5">0.5×</option></select></label><button id="play">播放预览</button><label>帧/秒 <input id="fps" type="number" value="10" min="1" max="60" style="width:70px"></label><a id="download" class="download">保存当前 PNG</a></div><div class="stage"><img id="image" alt="当前帧"></div><div id="frame-status"></div><div id="frames" class="frames"></div><pre id="meta" class="details"></pre></dialog>
<script src="catalog.js"></script><script>
'use strict';const $=id=>document.getElementById(id),data=window.SPRITE_LIBRARY;let page=0,filtered=[],selected,vi=0,fi=0,timer;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function filter(){const q=$('search').value.toLowerCase(),ch=+$('chapter').value;filtered=data.items.filter(g=>(!$('kind').value||g.kind===$('kind').value)&&g.name.toLowerCase().includes(q)&&(!$('variants').checked||g.variants.length>1)&&(!ch||g.variants.some(v=>v.chapters.includes(ch))));page=0;render()}
function render(){const total=Math.max(1,Math.ceil(filtered.length/60));$('page').textContent=`${page+1} / ${total}`;$('prev').disabled=!page;$('next').disabled=page+1>=total;$('stats').textContent=`找到 ${filtered.length.toLocaleString()} 个名称 · 全库 ${data.summary.names.toLocaleString()} 个名称 / ${data.summary.unique_images.toLocaleString()} 张去重 PNG`;$('grid').replaceChildren();for(const g of filtered.slice(page*60,page*60+60)){const card=el('button',undefined,'card'),preview=el('div',undefined,'preview');const f=g.variants.flatMap(v=>v.frames).find(f=>f.image);if(f){const img=el('img');img.src=f.image;img.alt=g.name;img.loading='lazy';preview.append(img)}else preview.textContent='无普通位图帧';card.append(preview,el('div',g.name,'name'),el('small',`${g.kind} · Ch${[...new Set(g.variants.flatMap(v=>v.chapters))].sort().join('/')} · ${g.variants.length} 变体 · ${g.variants.map(v=>v.frames.length).join('/')} 帧`));card.onclick=()=>open(g);$('grid').append(card)}}
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放预览'}
function open(g){stop();selected=g;vi=0;fi=0;$('title').textContent=g.name;$('variant').replaceChildren();g.variants.forEach((v,i)=>{let o=el('option',`Ch${v.chapters.join('/')} · ${v.frames.length} 帧`);o.value=i;$('variant').append(o)});showVariant();$('detail').showModal()}
function showVariant(){stop();fi=0;const v=selected.variants[vi];$('frames').replaceChildren();v.frames.forEach((f,i)=>{const b=el('button',String(i));b.onclick=()=>{stop();fi=i;showFrame()};$('frames').append(b)});$('meta').textContent=JSON.stringify({name:v.name,kind:v.kind,chapters:v.chapters,resource_indices:v.resource_indices,width:v.width,height:v.height,origin:v.origin,bbox:v.bbox,resource_speed:v.speed,resource_speed_type:v.speed_type,tile_size:v.tile_size},null,2);showFrame()}
function showFrame(){const v=selected.variants[vi],f=v.frames[fi];$('image').hidden=!f?.image;$('download').hidden=!f?.image;if(f?.image){$('image').src=f.image;$('image').style.width=f.width*+$('scale').value+'px';$('image').style.height=f.height*+$('scale').value+'px';$('download').href=f.image;$('download').download=`${v.name}_ch${v.chapters.join('-')}_${fi}.png`}$('frame-status').textContent=f?`帧 ${fi} / ${Math.max(0,v.frames.length-1)} · ${f.width||'?'} × ${f.height||'?'}${f.error?' · 导出错误：'+f.error:f.missing?' · 无贴图引用':''}`:'该资源没有普通位图帧';[...$('frames').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===fi)))}
$('variant').onchange=()=>{vi=+$('variant').value;showVariant()};$('scale').onchange=showFrame;$('play').onclick=()=>{if(timer){stop();return}if(!selected.variants[vi].frames.length)return;$('play').textContent='暂停';timer=setInterval(()=>{fi=(fi+1)%selected.variants[vi].frames.length;showFrame()},1000/Math.max(1,Math.min(60,+$('fps').value||10)))};$('fps').onchange=stop;$('close').onclick=()=>$('detail').close();$('detail').onclose=stop;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};for(const id of ['search','kind','chapter','variants'])$(id).addEventListener(id==='search'?'input':'change',filter);filter();
</script></html>
