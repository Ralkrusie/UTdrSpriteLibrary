<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DELTARUNE 动画素材库</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>DELTARUNE <span>动画素材库</span></h1><p>第 1–5 章 · 手机版</p><input id="search" type="search" placeholder="搜索资源名，如 bibliox、seth_drawing" aria-label="搜索资源名"><div class="controls"><select id="chapter" aria-label="章节"><option value="0">全部章节</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label><input id="multi" type="checkbox" checked>仅多帧</label><label><input id="different" type="checkbox">仅同名变体</label></div></header>
<main><details id="batch"><summary>批量导出 <span id="selected">0 项</span></summary><div class="controls"><label>缩放 <select id="batch-scale"></select></label><label>格式 <select id="batch-format"><option value="png-all">PNG 全部帧</option><option value="apng">APNG 动图</option><option value="gif">GIF 动图</option></select></label><label>速度 <select id="batch-speed"><option selected>3.75</option><option>7.5</option><option value="custom">自定 FPS</option></select></label><input id="batch-fps" type="number" aria-label="批量 FPS" value="3.75" min="0.1" max="120" step="any" hidden></div><div class="controls"><button id="select-page">选择本页</button><button id="clear">清空选择</button><button id="export-batch" class="primary">批量导出已勾选内容</button></div></details>
<p id="status" role="status">正在加载目录…</p><button id="retry" hidden>重新加载</button><div id="grid"></div><nav><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav></main>
<dialog id="detail"><div class="heading"><h2 id="name"></h2><button id="close">关闭</button></div><div class="controls"><button id="play">暂停</button><label>速度 <select id="speed"><option selected>3.75</option><option>7.5</option><option value="custom">自定 FPS</option></select></label><input id="fps" type="number" aria-label="预览 FPS" value="3.75" min="0.1" max="120" step="any" hidden><label>缩放 <select id="scale"></select></label></div><p id="dimensions"></p><div class="stage"><canvas id="canvas"></canvas></div><div class="controls"><button id="back">上一帧</button><input id="scrub" type="range" aria-label="帧序" min="0"><button id="forward">下一帧</button><span id="frame"></span></div><div class="controls"><select id="format" aria-label="导出格式"><option value="png">PNG 当前帧</option><option value="png-all">PNG 全部帧</option><option value="apng">APNG 动图</option><option value="gif">GIF 动图</option></select><button id="export" class="primary">直接单独导出</button></div><p id="detail-status" role="status"></p></dialog>
<dialog id="job"><h2>导出</h2><p id="job-status" role="status"></p><progress id="progress"></progress><div class="controls"><button id="cancel">取消</button><button id="save-all" hidden>保存全部图片</button><button id="job-close" hidden>关闭</button></div><div id="downloads"></div></dialog><footer>游戏素材版权归原权利人 · 预览按所选帧率播放</footer><script type="module" src="app.js"></script></body></html>
